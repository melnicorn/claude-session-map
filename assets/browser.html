<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&family=Overpass+Mono:wght@400;600&display=swap">
<style>
/* Layout: the map's transit-board style as a departures board. Header, totals, filter bar, then one table of sessions. */
:root{
  --paper:#F1F3F0; --panel:#FFFFFF; --ink:#13171B; --muted:#5A626A; --rule:#D2D7D3; --accent:#0B5FA5;
  --opus:#0A6BC2; --fable:#8A3FA0; --sonnet:#0E8F55; --haiku:#E07B00; --other:#5A626A;
  --font-display:"Overpass",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Overpass",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-data:"Overpass Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1216; --panel:#151B20; --ink:#E6EAED; --muted:#96A0A9; --rule:#28313A; --accent:#5AA9F0;
    --opus:#3D95E8; --fable:#B26BCB; --sonnet:#2DB877; --haiku:#F5992E; --other:#96A0A9;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1216; --panel:#151B20; --ink:#E6EAED; --muted:#96A0A9; --rule:#28313A; --accent:#5AA9F0;
  --opus:#3D95E8; --fable:#B26BCB; --sonnet:#2DB877; --haiku:#F5992E; --other:#96A0A9;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
header.top{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;border-bottom:6px solid var(--ink);padding-bottom:16px}
.brand{display:flex;gap:14px;align-items:flex-start;min-width:0}
.glyph{flex:none;width:30px;height:30px;border-radius:50%;border:7px solid var(--ink);background:var(--panel);margin-top:6px}
.eyebrow{font-family:var(--font-data);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--font-display);font-weight:800;font-size:clamp(26px,3.6vw,40px);line-height:1.1;margin:2px 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px}
.sub code{font-family:var(--font-data);font-size:12.5px}
button,select,input{font:inherit;color:var(--ink)}
button{font-weight:600;font-size:13px;line-height:1;background:var(--panel);border:2px solid var(--ink);border-radius:999px;padding:9px 14px 7px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--ink);color:var(--paper)}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,tr:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.tile{background:var(--panel);padding:14px 16px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-family:var(--font-data);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--font-data);font-weight:600;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2;overflow-wrap:anywhere}
.tile .n{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.tile.lead .v{color:var(--accent)}

.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;background:var(--panel);border:1px solid var(--rule);padding:12px 16px}
.bar .grow{flex:1 1 220px;min-width:0}
.bar input[type=search]{width:100%;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:9px 12px 7px}
.bar select{background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px 6px;max-width:100%}
.bar label{display:inline-flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted);cursor:pointer}
.bar .k{font-family:var(--font-data);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-2px;padding:8px 12px 6px}
.seg button:first-child{border-radius:999px 0 0 999px;margin-left:0}
.seg button:last-child{border-radius:0 999px 999px 0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--rule)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-family:var(--font-data);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400;text-align:left;padding:10px 12px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
td.num,th.num{text-align:right;font-family:var(--font-data);font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 7%,transparent)}
tbody tr.sel td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.cb{width:34px;padding-right:0}
.cb input{width:16px;height:16px;cursor:pointer;accent-color:var(--accent)}
.title{display:flex;flex-direction:column;gap:2px;min-width:260px}
.title a{color:var(--ink);font-weight:700;text-decoration:none}
.title a:hover{text-decoration:underline;text-underline-offset:3px}
.title .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tag{font-family:var(--font-data);font-size:10.5px;color:var(--muted);border:1px solid var(--rule);padding:1px 6px 0;border-radius:4px;white-space:nowrap}
.untitled a{color:var(--muted);font-weight:600}
.live{font-family:var(--font-data);font-size:10.5px;color:var(--sonnet);display:inline-flex;gap:5px;align-items:center}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sonnet)}
.when{white-space:nowrap}
.when .d{display:block;font-size:12px;color:var(--muted)}
.agents{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.agents .track{width:64px;height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.agents .fill{height:100%;background:var(--accent)}
.models{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-family:var(--font-data);font-size:11px;font-weight:600;padding:2px 7px 1px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.chip.opus{color:var(--opus)} .chip.fable,.chip.mythos{color:var(--fable)} .chip.sonnet{color:var(--sonnet)} .chip.haiku{color:var(--haiku)} .chip.other{color:var(--other)}
.state{padding:40px 16px;text-align:center;color:var(--muted)}
.foot{color:var(--muted);font-size:12.5px;font-family:var(--font-data)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="glyph" aria-hidden="true"></div>
      <div>
        <div class="eyebrow">Session line map</div>
        <h1>Sessions</h1>
        <div class="sub" id="sub">Reading transcripts…</div>
      </div>
    </div>
    <button type="button" id="refresh" title="Re-read transcripts">Refresh</button>
  </header>

  <section class="board" id="board" aria-label="Totals"></section>

  <section class="bar" aria-label="Filters">
    <div class="grow"><input type="search" id="q" placeholder="Search titles and projects" aria-label="Search sessions"></div>
    <select id="project" aria-label="Project"><option value="">All projects</option></select>
    <span class="k">Sort</span>
    <span class="seg" id="sort">
      <button type="button" data-sort="last" aria-pressed="true">Recent</button>
      <button type="button" data-sort="messages" aria-pressed="false">Messages</button>
      <button type="button" data-sort="subagents" aria-pressed="false">Subagents</button>
      <button type="button" data-sort="size" aria-pressed="false">Size</button>
    </span>
    <label><input type="checkbox" id="withAgents"> With subagents</label>
    <button type="button" class="primary" id="mapSel" disabled>Map selected</button>
  </section>

  <div class="tablewrap">
    <table>
      <thead><tr>
        <th class="cb"><span hidden>Select</span></th><th>Session</th><th>Last active</th><th class="num">Span</th>
        <th class="num">Your messages</th><th class="num">Subagents</th><th>Models</th><th class="num">Size</th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="8" class="state">Reading transcripts…</td></tr></tbody>
    </table>
  </div>
  <div class="foot" id="foot"></div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const store = { get(k){ try { return localStorage.getItem('sm-browser-' + k); } catch (e) { return null; } },
                  set(k, v){ try { localStorage.setItem('sm-browser-' + k, v); } catch (e) {} } };
  let all = [], selected = new Set(), sort = store.get('sort') || 'last';

  const ago = t => {
    const s = Date.now() / 1000 - t;
    if (s < 120) return 'just now';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' h ago';
    if (s < 86400 * 14) return Math.round(s / 86400) + ' days ago';
    return new Date(t * 1000).toLocaleDateString([], {month: 'short', day: 'numeric', year: 'numeric'});
  };
  const when = t => new Date(t * 1000).toLocaleString([], {weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'});
  const span = (a, b) => { if (!a || !b) return '—'; const s = b - a; if (s < 3600) return Math.max(1, Math.round(s / 60)) + 'm'; if (s < 86400 * 2) return (s / 3600).toFixed(s < 36000 ? 1 : 0) + 'h'; return Math.round(s / 86400) + 'd'; };
  const size = n => n >= 1e6 ? (n / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1e3)) + ' KB';
  const family = m => (/claude-([a-z]+)/.exec(m) || [, 'other'])[1];
  const modelName = m => { const r = /claude-([a-z]+)-(\d+)(?:-(\d{1,2}))?/.exec(m || ''); return r ? r[1][0].toUpperCase() + r[1].slice(1) + ' ' + r[2] + (r[3] ? '.' + r[3] : '') : m; };
  const mapUrl = ids => '/map?ids=' + ids.join(',');

  function filtered(){
    const q = $('q').value.trim().toLowerCase(), proj = $('project').value, agentsOnly = $('withAgents').checked;
    let rows = all.filter(s => (!q || (s.title + ' ' + s.project).toLowerCase().includes(q)) && (!proj || s.project === proj) && (!agentsOnly || s.subagents > 0));
    const key = {last: s => s.last || 0, messages: s => s.messages, subagents: s => s.subagents, size: s => s.size}[sort];
    return rows.sort((a, b) => key(b) - key(a));
  }

  function board(){
    const now = Date.now() / 1000;
    const week = all.filter(s => now - (s.last || 0) < 7 * 86400);
    const projects = new Set(all.map(s => s.project));
    const msgs = all.reduce((n, s) => n + s.messages, 0);
    const agents = all.reduce((n, s) => n + s.subagents, 0);
    const byProj = {};
    week.forEach(s => byProj[s.project] = (byProj[s.project] || 0) + s.messages);
    const busiest = Object.entries(byProj).sort((a, b) => b[1] - a[1])[0];
    const mostAgents = all.reduce((b, s) => s.subagents > (b?.subagents || 0) ? s : b, null);
    const tiles = [
      ['Sessions', all.length, `${projects.size} projects`, 'lead'],
      ['This week', week.length, `${week.reduce((n, s) => n + s.messages, 0)} messages from you`],
      ['Your messages', msgs.toLocaleString(), 'Across every session'],
      ['Subagents', agents.toLocaleString(), mostAgents ? `Most: ${mostAgents.subagents} in “${mostAgents.title}”` : 'None yet'],
      ['Busiest this week', busiest ? busiest[0] : '—', busiest ? `${busiest[1]} messages` : 'No activity'],
    ];
    $('board').innerHTML = tiles.map(([k, v, n, cls]) => `<div class="tile ${cls || ''}"><div class="k">${k}</div><div class="v">${esc(v)}</div><div class="n">${esc(n)}</div></div>`).join('');
  }

  function render(){
    const rows = filtered();
    const maxAgents = Math.max(1, ...all.map(s => s.subagents));
    const now = Date.now() / 1000;
    $('rows').innerHTML = rows.length ? rows.map(s => `
      <tr data-id="${s.id}" class="${selected.has(s.id) ? 'sel' : ''}" tabindex="0">
        <td class="cb"><input type="checkbox" aria-label="Select ${esc(s.title)}" ${selected.has(s.id) ? 'checked' : ''}></td>
        <td><div class="title ${s.untitled ? 'untitled' : ''}"><a href="${mapUrl([s.id])}">${esc(s.title)}</a>
          <div class="meta"><span class="tag">${esc(s.project)}</span><span>${s.id.slice(0, 8)}</span>${now - s.modified < 180 ? '<span class="live">active now</span>' : ''}${s.mapRuns ? `<span>${s.mapRuns} map run${s.mapRuns > 1 ? 's' : ''}</span>` : ''}</div></div></td>
        <td class="when" title="${esc(when(s.last))}">${esc(ago(s.last))}<span class="d">${esc(when(s.last))}</span></td>
        <td class="num">${span(s.first, s.last)}</td>
        <td class="num">${s.messages || '—'}</td>
        <td class="num"><div class="agents">${s.subagents || '—'}${s.subagents ? `<span class="track"><span class="fill" style="width:${Math.max(6, 100 * Math.sqrt(s.subagents / maxAgents))}%"></span></span>` : ''}</div></td>
        <td><div class="models">${s.models.slice(0, 3).map(m => `<span class="chip ${family(m)}">${esc(modelName(m))}</span>`).join('')}</div></td>
        <td class="num">${size(s.size)}</td>
      </tr>`).join('') : `<tr><td colspan="8" class="state">No sessions match.</td></tr>`;
    $('foot').textContent = `Showing ${rows.length} of ${all.length} · click a session to open its map · select several to see them as tabs on one map`;
    $('mapSel').disabled = !selected.size;
    $('mapSel').textContent = selected.size ? `Map selected (${selected.size})` : 'Map selected';
  }

  $('rows').addEventListener('click', ev => {
    const tr = ev.target.closest('tr[data-id]'); if (!tr) return;
    const id = tr.dataset.id;
    if (ev.target.matches('input[type=checkbox]')){
      ev.target.checked ? selected.add(id) : selected.delete(id);
      tr.classList.toggle('sel', ev.target.checked);
      $('mapSel').disabled = !selected.size;
      $('mapSel').textContent = selected.size ? `Map selected (${selected.size})` : 'Map selected';
      return;
    }
    if (ev.target.closest('a')) return;           // the title link handles itself, including Cmd-click
    if (ev.metaKey || ev.ctrlKey) window.open(mapUrl([id]), '_blank');
    else location.href = mapUrl([id]);
  });
  $('rows').addEventListener('keydown', ev => { const tr = ev.target.closest('tr[data-id]'); if (tr && ev.key === 'Enter' && ev.target === tr) location.href = mapUrl([tr.dataset.id]); });
  $('mapSel').onclick = () => { if (selected.size) location.href = mapUrl([...selected]); };
  ['q', 'project', 'withAgents'].forEach(id => $(id).addEventListener('input', render));
  document.querySelectorAll('#sort button').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.sort === sort));
    b.onclick = () => { sort = b.dataset.sort; store.set('sort', sort); document.querySelectorAll('#sort button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); render(); };
  });

  async function load(){
    $('refresh').disabled = true;
    try {
      const r = await fetch('/api/sessions');
      if (!r.ok) throw new Error(await r.text());
      const d = await r.json();
      all = d.sessions;
      const keep = $('project').value;
      const projects = [...new Set(all.map(s => s.project))].sort((a, b) => a.localeCompare(b));
      $('project').innerHTML = '<option value="">All projects</option>' + projects.map(p => `<option ${p === keep ? 'selected' : ''}>${esc(p)}</option>`).join('');
      $('sub').innerHTML = `${all.length} sessions · read in ${d.took}s from <code>${esc(d.projectsDir.replace(/^\/Users\/[^/]+/, '~'))}</code>`;
      board(); render();
    } catch (e) {
      $('rows').innerHTML = `<tr><td colspan="8" class="state">Couldn't read sessions: ${esc(e.message)}. Is the server still running?</td></tr>`;
    } finally { $('refresh').disabled = false; }
  }
  $('refresh').onclick = load;
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  load();
})();
</script>
</body>
</html>
